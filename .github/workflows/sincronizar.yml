# Lee los correos de Santander, actualiza docs/datos/finanzas.enc (cifrado) y publica la app.
# Los registros son públicos: el script sólo imprime conteos.
name: Sincronizar y publicar

on:
  schedule:
    - cron: "7 */3 * * *"          # cada 3 horas
  workflow_dispatch:
    inputs:
      completo:
        description: "Volver a leer todo el historial"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ingesta/**"
      - ".github/workflows/sincronizar.yml"
      - "!docs/datos/**"

concurrency:
  group: finanzas
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingesta/requirements.txt

      - run: pip install -r ingesta/requirements.txt

      - name: Leer correos nuevos
        env:
          CLAVE_APP: ${{ secrets.CLAVE_APP }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          if [ "${{ inputs.completo }}" = "true" ]; then
            python -m ingesta.sincronizar --completo
          else
            python -m ingesta.sincronizar
          fi

      - name: Guardar datos
        run: |
          git config user.name "finanzas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/datos/finanzas.enc
          if git diff --cached --quiet; then
            echo "Sin cambios."
            # Un latido al mes para que GitHub no apague el cron por inactividad.
            ultimo=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - ultimo )) -gt 2592000 ]; then
              git commit --allow-empty -m "latido: sigue activo"
              git pull --rebase origin main && git push
            fi
          else
            git commit -m "datos: correos nuevos"
            git pull --rebase origin main && git push
          fi

  publicar:
    needs: sincronizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
